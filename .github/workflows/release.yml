name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  create-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Monitor Agent $GITHUB_REF_NAME" --verify-tag --generate-notes
          fi

  linux-run:
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - run: python -m pip install "build==1.5.0"
      - run: python -m build --wheel --outdir dist
      - name: Build Linux self-extracting installer
        run: |
          wheel=$(ls dist/monitor_agent-*.whl)
          archive=$(python scripts/build_unix_package.py --os linux --wheel "$wheel" --output dist)
          run=$(sh scripts/make_selfextract.sh "$archive" Install.sh "${archive%.tar.gz}.run")
          echo "RUN_ASSET=$run" >> "$GITHUB_ENV"
          echo "WHEEL_ASSET=$wheel" >> "$GITHUB_ENV"
      - name: Upload Linux installer and wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$RUN_ASSET" "$WHEEL_ASSET" \
            --repo "$GITHUB_REPOSITORY" --clobber

  windows-exe:
    needs: create-release
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - run: python -m pip install "build==1.5.0"
      - run: python -m build --wheel --outdir dist
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Build Windows GUI installer
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/monitor_agent-*.whl | Select-Object -First 1
          $version = $wheel.Name -replace '^monitor_agent-', '' -replace '-py3.*$', ''
          $payload = "deploy/windows/payload"
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          Copy-Item $wheel.FullName $payload
          Copy-Item requirements.lock $payload
          Copy-Item deploy/windows/gui-install.ps1 $payload
          Copy-Item deploy/windows/gui-uninstall.ps1 $payload
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "/Odist" deploy/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $exe = "dist/MonitorAgent-Windows-$version-Setup.exe"
          if (-not (Test-Path $exe)) { throw "installer was not produced at $exe" }
          "EXE_ASSET=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Upload Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" "$env:EXE_ASSET" --repo "$env:GITHUB_REPOSITORY" --clobber

  macos-dmg:
    needs: create-release
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - run: python -m pip install "build==1.5.0"
      - run: python -m build --wheel --outdir dist
      - name: Build macOS disk image
        run: |
          wheel=$(ls dist/monitor_agent-*.whl)
          archive=$(python scripts/build_unix_package.py --os macos --wheel "$wheel" --output dist)
          staging=$(mktemp -d)
          tar -xzf "$archive" -C "$staging"
          volume=$(basename "${archive%.tar.gz}")
          dmg="dist/$volume.dmg"
          hdiutil create -volname "Monitor Agent" -srcfolder "$staging" -ov -format UDZO "$dmg"
          echo "DMG_ASSET=$dmg" >> "$GITHUB_ENV"
      - name: Upload macOS installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$DMG_ASSET" --repo "$GITHUB_REPOSITORY" --clobber
