name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src/monitor_agent

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install "pip-audit==2.10.1"
      - run: python -m pip install --dry-run --require-hashes -r requirements.lock
      - run: python -m pip_audit -r requirements.lock --disable-pip

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - if: matrix.os == 'windows-2025'
        run: >-
          python -m pytest --ignore=tests/deploy
          --ignore=tests/test_spool.py
          --ignore=tests/test_identity.py
          --ignore=tests/test_logging_setup.py
          --ignore=tests/test_runtime.py
          --ignore=tests/test_cli.py
          --ignore=tests/collectors/test_processes.py
          --ignore=tests/collectors/test_software.py
      - if: matrix.os != 'windows-2025'
        run: python -m pytest --ignore=tests/deploy

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - run: python -m pip install "build==1.5.0" "twine==6.2.0"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel and sdist versions
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile
          from email.parser import Parser

          expected = "2.0.0"
          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == len(sdists) == 1, (wheels, sdists)
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_metadata = archive.read(
                  next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              ).decode()
          with tarfile.open(sdists[0]) as archive:
              sdist_metadata = archive.extractfile(
                  next(member for member in archive.getmembers() if member.name.endswith("/PKG-INFO"))
              ).read().decode()
          assert Parser().parsestr(wheel_metadata)["Version"] == expected, wheel_metadata
          assert Parser().parsestr(sdist_metadata)["Version"] == expected, sdist_metadata
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monitor-agent-2.0.0
          path: dist/
          if-no-files-found: error

  deployment-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/deploy/test_linux.py -q --no-cov
      - name: Parse Linux deployment scripts
        run: |
          for script in deploy/linux/install.sh deploy/linux/uninstall.sh; do
            bash -n "$script" || exit $?
          done
      - run: shellcheck deploy/linux/install.sh deploy/linux/uninstall.sh
      - name: Verify systemd unit against staged runtime
        run: |
          staged_root="$(mktemp -d)"
          install -Dm644 deploy/linux/monitor-agent.service "$staged_root/etc/systemd/system/monitor-agent.service"
          install -Dm755 /bin/true "$staged_root/opt/monitor-agent/venv/bin/monitor-agent"
          install -Dm600 /dev/null "$staged_root/etc/monitor-agent/monitor-agent.env"
          for target in sysinit.target network-online.target multi-user.target; do
            target_path="$staged_root/usr/lib/systemd/system/$target"
            install -Dm644 /dev/null "$target_path"
            printf '%s\n' '[Unit]' "Description=staged $target" > "$target_path"
          done
          systemd-analyze verify --root="$staged_root" --recursive-errors=yes /etc/systemd/system/monitor-agent.service

  deployment-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/deploy/test_windows.py -q --no-cov
      - name: Parse PowerShell deployment scripts
        shell: powershell
        run: |
          Get-ChildItem -Path deploy/windows -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Parse scheduled-task XML
        shell: pwsh
        run: |
          $task = New-Object System.Xml.XmlDocument
          $task.Load((Resolve-Path -LiteralPath deploy/windows/monitor_agent_task.xml))

  deployment-macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/deploy/test_macos.py -q --no-cov
      - name: Parse macOS deployment scripts
        run: |
          for script in deploy/macos/install.sh deploy/macos/run-agent.sh deploy/macos/uninstall.sh; do
            sh -n "$script" || exit $?
          done
      - run: plutil -lint deploy/macos/com.company.monitor-agent.plist
