[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-agent"
version = "2.0.0"
description = "Cross-platform endpoint telemetry agent"
requires-python = ">=3.11,<3.15"
dependencies = [
  "psutil==7.2.2",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "mypy>=1.16",
  "pip-audit>=2.9",
  "pip-tools>=7.5",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-requests>=2.32",
]

[project.scripts]
monitor-agent = "monitor_agent.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=monitor_agent --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["monitor_agent"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["monitor_agent"]
